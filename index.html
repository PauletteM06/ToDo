<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>ToDo List</title>
</head>
<body>

    <header class="header">
        <div>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-circle-check"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M9 12l2 2l4 -4" /></svg>
            <p>Today</p>
        </div>

        <div class="btn_tareas">
            <button type="button" class="btn_tareas_todas" data-name="todas">Todas</button>
            <button type="button" class="btn_tareas_pendientes" data-name="pendientes">Pendientes</button>
            <button type="button" class ="btn_tareas_completadas" data-name="completadas">Completadas</button>
        </div>
    </header>

    <main>

        <div class="container_title">
            <div class="container_title_div">
                <div>
                    <h1>Mis Tareas</h1>
                    <div class="container_pendientes">
                        <p class="pendientes"></p>
                    </div>
                </div>
                
                <p class="fecha"></p>
            </div>
            <p>Mantén tu mente despejada y avanza con calma paso a paso.</p>
        </div>

        <form class="form" action="#">
            <input type="text" id="tarea" name="tarea" placeholder="¿Qué tienes pendiente hoy?">
            <button type="submit">+ Agregar</button>
        </form>
        <p class="error" style="color: red;"></p>


        <div class="btn_tareas_main btn_tareas ">
            <button type="button" class="btn_tareas_todas" data-name="todas">Todas</button>
            <button type="button" class="btn_tareas_pendientes" data-name="pendientes">Pendientes</button>
            <button type="button" class ="btn_tareas_completadas" data-name="completadas">Completadas</button>
        </div>

        <section class="tareas">

            <div class="lista-tareas">

            </div>

        </section>

    </main>

    <footer>
        <p>Today Task Management</p>
        <p>Designed for high-focus productivity</p>
    </footer>

    <script src="main.js"></script>
    
</body>
</html>
