<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
</head>
<body>

    <header>
        <div>

            <p>Today</p>
        </div>

        <div>
            <button>Todas</button>
            <button>Pendientes</button>
            <button>Completadas</button>
        </div>
    </header>

    <main>

        <div>
            <div>
                <div>
                    <h1>Mis Tareas</h1>
                    <div>
                        <p></p>
                    </div>
                </div>
                
                <p class="fecha"></p>
            </div>
            <p>Mantén tu mente despejada y avanza con calma paso a paso</p>
        </div>

        <form action="#">
            <div>
                <label for="tarea">Nueva tarea</label>
                <input type="text" id="tarea" name="tarea" placeholder="¿Qué tienes pendiente hoy?">
            </div>
            <button type="submit">+ Agregar</button>
        </form>

        <div>
            <button>Todas</button>
            <button>Pendientes</button>
            <button>Completadas</button>
        </div>


        <section>

            <div class="lista-tareas">

            </div>


        </section>

        <footer>
            <p>Today Task Management</p>
            <p>Designed for high-focus productivity</p>
        </footer>
    </main>
    
</body>
</html>
